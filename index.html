<html lang="ar" dir="rtl">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --bg-dark: #0f172a; --card-dark: #1e293b; --gold: #fbbf24;
            --blue: #3b82f6; --green: #22c55e; --red: #ef4444; --text: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); overflow-x: hidden; }
        header { background: rgba(30, 41, 59, 0.95); padding: 15px 5%; position: fixed; top: 0; width: 100%; z-index: 1000; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
        .container { max-width: 1000px; margin: 120px auto 40px; padding: 0 20px; }
        
        .setup-card { background: var(--card-dark); padding: 30px; border-radius: 20px; border: 1px solid var(--gold); text-align: center; }
        .grid-select { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        label { display: block; margin-bottom: 10px; color: var(--gold); font-weight: bold; }
        select, .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; }
        select { background: #334155; color: white; }
        .btn-main { background: linear-gradient(135deg, var(--gold), #d97706); color: #000; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { transform: scale(1.03); }
        .btn-red { background: linear-gradient(135deg, var(--red), #991b1b); }
        .btn-blue { background: linear-gradient(135deg, var(--blue), #1d4ed8); }

        #lobbyView { display: none; text-align: center; }
        .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; margin: 25px 0; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; }
        .p-box { text-align: center; position: relative; padding: 10px; border-radius: 10px; }
        .p-box img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--green); }
        .p-box.eliminated img { border-color: var(--red); opacity: 0.5; }
        .status-on { position: absolute; bottom: 35px; right: 25px; width: 15px; height: 15px; background: var(--green); border-radius: 50%; border: 2px solid var(--card-dark); }

        #gameArena { display: none; }
        .stats-bar { display: flex; justify-content: space-around; background: var(--card-dark); padding: 15px; border-radius: 15px; margin-bottom: 20px; border-bottom: 4px solid var(--gold); }
        .p-stat { text-align: center; }
        .p-stat img { width: 50px; height: 50px; border-radius: 50%; }
        .score { font-size: 22px; font-weight: 900; color: var(--gold); }
        
        .turn-box { text-align: center; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; }
        .q-card { background: var(--card-dark); padding: 25px; border-radius: 20px; text-align: center; position: relative; }
        .timer-bg { width: 100%; height: 8px; background: #334155; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        .timer-fill { width: 100%; height: 100%; background: var(--gold); transition: 1s linear; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .opt-btn { padding: 15px; background: #334155; color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .opt-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .opt-btn:hover:not(:disabled) { background: var(--blue); }

        #authModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 9999; }
        
        .category-tag {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
            border: 1px solid #3b82f6;
        }
        
        .time-warning { color: #fbbf24; font-weight: bold; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .action-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .action-buttons button { flex: 1; max-width: 200px; }
        
        .withdraw-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        
        /* الأنماط الجديدة */
        .leaderboard-btn {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 1px 5px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 1px;
        }
        
        .leaderboard-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        
        .leaderboard-container {
            background: var(--card-dark);
            padding: 3px;
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            transition: 0.3s;
        }
        
        .leaderboard-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(-5px);
        }
        
        .leaderboard-rank {
            width: 50px;
            text-align: center;
            font-size: 8px;
            font-weight: bold;
            color: var(--gold);
        }
        
        .leaderboard-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-left: 15px;
            border: 3px solid var(--gold);
        }
        
        .leaderboard-info {
            flex: 1;
        }
        
        .leaderboard-name {
            font-weight: bold;
            font-size: 8px;
        }
        
        .leaderboard-stats {
            display: flex;
            gap: 2px;
            margin-top: 5px;
        }
        
        .leaderboard-stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .trophy-icon {
            color: var(--gold);
            margin-right: 5px;
        }
        
        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--gold);
        }
        
        .user-trophy {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(251, 191, 36, 0.2);
            padding: 3px 10px;
            border-radius: 15px;
            margin-right: 10px;
        }
        
        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
    </style>
</head>

        window.joinMatch = async () => {
            if (!user) return document.getElementById('authModal').style.display='flex';
            const pLimit = parseInt(document.getElementById('selPlayers').value);
            const fee = parseInt(document.getElementById('selFee').value);
            if (userData.gems < fee) return alert("رصيدك غير كافٍ!");

            await updateDoc(doc(db, "users", user.uid), { gems: increment(-fee) });
            userData.gems -= fee;
            document.getElementById('uGems').textContent = userData.gems.toLocaleString();

            document.getElementById('setupView').style.display = 'none';
            document.getElementById('lobbyView').style.display = 'block';

            const qRoom = query(collection(db, "rooms"), where("status", "==", "waiting"), where("maxPlayers", "==", pLimit), where("fee", "==", fee));
            const snap = await getDocs(qRoom);
            
            const myPlayer = { 
                uid: user.uid, name: userData.name, 
                photo: user.photoURL || `https://ui-avatars.com/api/?name=${userData.name}`, 
                score: 0, status: "active", answeredQ: -1 
            };

            if (!snap.empty) {
                roomId = snap.docs[0].id;
                await updateDoc(doc(db, "rooms", roomId), { players: arrayUnion(myPlayer) });
            } else {
                const res = await addDoc(collection(db, "rooms"), {
                    maxPlayers: pLimit, fee: fee, status: "waiting",
                    players: [myPlayer], currentQ: 0, createdAt: Date.now()
                });
                roomId = res.id;
            }
            monitorRoom();
        };

        function monitorRoom() {
            onSnapshot(doc(db, "rooms", roomId), async (snap) => {
                const data = snap.data();
                if (!data) return;
                currentRoomData = data;

                document.getElementById('playersGrid').innerHTML = data.players.map(p => `
                    <div class="p-box ${p.status === 'eliminated' ? 'eliminated' : ''}">
                        <img src="${p.photo}"><div class="status-on"></div>
                        <p style="font-size:10px">${p.name}</p>
                    </div>`).join('');
                
                document.getElementById('lobbyStatus').textContent = `بانتظار الأبطال (${data.players.length} / ${data.maxPlayers})`;

                if (data.players.length >= data.maxPlayers && data.status === "waiting") {
                    await updateDoc(doc(db, "rooms", roomId), { status: "active", startedAt: Date.now() });
                }

                if (data.status === "active") {
                    document.getElementById('lobbyView').style.display = 'none';
                    document.getElementById('gameArena').style.display = 'block';
                    syncGame(data);
                }
                
                if (data.status === "finished") showWinner(data);
            });
        }

        // ==============================================
        // نظام التزامن المعتمد على الوقت العالمي
        // ==============================================
        function syncGame(data) {
            const now = Date.now();
            const elapsedSinceStart = Math.floor((now - data.startedAt) / 1000);
            const questionDuration = 30; // ثانية
            const calculatedQ = Math.floor(elapsedSinceStart / questionDuration);
            const timeLeft = questionDuration - (elapsedSinceStart % questionDuration);

            // إذا انتهى الوقت لجميع الأسئلة
            if (calculatedQ >= 10) {
                if (data.status !== "finished") processRoundEnd(data);
                return;
            }

            // تحديث رقم السؤال عالمياً في الواجهة بناءً على الوقت
            if (data.currentQ !== calculatedQ) {
                updateDoc(doc(db, "rooms", roomId), { currentQ: calculatedQ });
            }

            const p1 = data.players[0];
            const p2 = data.players[1] || p1;
            document.getElementById('p1Score').textContent = p1.score;
            document.getElementById('p2Score').textContent = p2.score;
            document.getElementById('p1Name').textContent = p1.name;
            document.getElementById('p2Name').textContent = p2.name;
            document.getElementById('p1Img').src = p1.photo;
            document.getElementById('p2Img').src = p2.photo;

            document.getElementById('qCount').textContent = `السؤال ${calculatedQ + 1} / 10`;
            
            // جلب سؤال ثابت لكل رقم سؤال (باستخدام رقم السؤال كبذرة بسيطة)
            const qObj = questions[calculatedQ % questions.length].questions[calculatedQ % questions[0].questions.length]; 
            document.getElementById('qText').textContent = qObj.q;
            document.getElementById('categoryTag').textContent = questions[calculatedQ % questions.length].category;

            const me = data.players.find(p => p.uid === user.uid);
            const alreadyAnswered = me && me.answeredQ === calculatedQ;

            const oGrid = document.getElementById('optionsGrid');
            oGrid.innerHTML = "";
            qObj.o.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "opt-btn";
                btn.textContent = opt.t;
                btn.disabled = alreadyAnswered;
                btn.onclick = () => submitAnswer(opt.p, calculatedQ, data);
                oGrid.appendChild(btn);
            });

            // تحديث العداد البصري
            updateVisualTimer(timeLeft);
        }

        function updateVisualTimer(seconds) {
            const bar = document.getElementById('timerBar');
            const txt = document.getElementById('timerText');
            bar.style.width = (seconds / 60) * 100 + "%";
            txt.textContent = `الوقت المتبقي: ${seconds} ثانية`;
            if (seconds <= 10) txt.style.color = "var(--red)";
            else txt.style.color = "var(--gold)";
        }

        // تحديث مستمر للعداد كل ثانية
        setInterval(() => {
            if (currentRoomData && currentRoomData.status === "active") {
                syncGame(currentRoomData);
            }
        }, 1000);

        async function submitAnswer(pts, qIdx, data) {
            // أضف هذا السطر في بداية الدالة:
await new Promise(resolve => setTimeout(resolve, 1000)); // تأخير 1000 ملي ثانية (1 ثانية)
            const players = [...data.players];
            const idx = players.findIndex(p => p.uid === user.uid);
            if (players[idx].answeredQ === qIdx) return; // منع الإجابة المكررة

            players[idx].score += pts;
            players[idx].answeredQ = qIdx;

            await updateDoc(doc(db, "rooms", roomId), { players: players });
        }

        async function processRoundEnd(data) {
            await updateDoc(doc(db, "rooms", roomId), { status: "finished", finishedAt: Date.now() });
        }

        async function showWinner(data) {
            const totalPool = data.maxPlayers * data.fee;
            const netPool = totalPool * 0.90;
            const commission = totalPool * 0.10;
            const sorted = [...data.players].sort((a,b) => b.score - a.score);
            const prizes = calculatePrizes(data.maxPlayers, netPool);

            // تحديث عدد مرات الفوز للفائز الأول
            if (sorted[0].uid === user.uid) {
                await updateDoc(doc(db, "users", user.uid), { wins: increment(1) });
            }

            // إرسال العمولة مباشرة لصاحب البريد hsn5@H.com
            await updateAdminGems(commission);

            let html = `<div class="setup-card"><h2>نتائج البطولة النهائية</h2>`;
            sorted.forEach((p, i) => {
                const prize = prizes[i] || 0;
                html += `<p>${i+1}. ${p.name} - ${p.score} نقطة ${prize > 0 ? '(الفوز: '+Math.floor(prize)+' 💎)' : ''}</p>`;
                if (prize > 0 && p.uid === sorted[0].uid) updateUserGems(p.uid, prize);
            });
            html += `<button class="btn-main" onclick="location.reload()">العودة للرئيسية</button></div>`;
            document.getElementById('gameArena').innerHTML = html;
        }

        function calculatePrizes(count, amount) {
            if (count == 2) return [amount];
            if (count == 16) return [amount*0.4, amount*0.3, amount*0.2, amount*0.1];
            return [amount];
        }

        async function updateUserGems(uid, amount) {
            await updateDoc(doc(db, "users", uid), { gems: increment(Math.floor(amount)) });
        }

        async function updateAdminGems(amount) {
            const q = query(collection(db, "users"), where("email", "==", ADMIN_EMAIL));
            const snap = await getDocs(q);
            if (!snap.empty) {
                await updateDoc(doc(db, "users", snap.docs[0].id), { gems: increment(Math.floor(amount)) });
            } else {
                // إذا لم يوجد حساب للإدمن، ننشئه
                try {
                    await addDoc(collection(db, "users"), {
                        email: ADMIN_EMAIL,
                        name: "المشرف العام",
                        gems: Math.floor(amount),
                        wins: 0
                    });
                } catch (e) {
                    console.log("حساب المشرف موجود بالفعل");
                }
            }
        }

            const refund = Math.floor(currentRoomData.fee * 0.99);
            const adminFee = currentRoomData.fee * 0.01;
            const newPlayers = currentRoomData.players.filter(p => p.uid !== user.uid);
            
            if (newPlayers.length === 0) await deleteDoc(doc(db, "rooms", roomId));
            else await updateDoc(doc(db, "rooms", roomId), { players: newPlayers });

            await updateDoc(doc(db, "users", user.uid), { gems: increment(refund) });
            updateAdminGems(adminFee);
            location.reload();
        };

        window.closeWithdrawModal = () => document.getElementById('withdrawModal').style.display = 'none';

        window.handleAuth = async () => {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { 
                await signInWithEmailAndPassword(auth, e, p); 
                location.reload();
            } catch(err) { alert(err.message); }
        };

        // وظيفة لعرض قائمة الأبطال
        window.showLeaderboard = async () => {
            document.getElementById('leaderboardModal').style.display = 'flex';
            const q = query(collection(db, "users"), where("wins", ">", 0));
            const snap = await getDocs(q);
            const users = [];
            snap.forEach(doc => {
                users.push({ id: doc.id, ...doc.data() });
            });
            
            // ترتيب المستخدمين حسب عدد مرات الفوز
            users.sort((a, b) => b.wins - a.wins);
            
            const leaderboardList = document.getElementById('leaderboardList');
            leaderboardList.innerHTML = '';
            
            users.forEach((user, index) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `
                    <div class="leaderboard-rank">${index + 1}</div>
                    <img class="leaderboard-avatar" src="${user.photo || `https://ui-avatars.com/api/?name=${user.name}`}">
                    <div class="leaderboard-info">
                        <div class="leaderboard-name">${user.name}</div>
                        <div class="leaderboard-stats">
                            <div class="leaderboard-stat">
                                <i class="fas fa-trophy trophy-icon"></i>
                                <span>${user.wins || 0} فوز</span>
                            </div>
                            <div class="leaderboard-stat">
                                <i class="fas fa-gem" style="color:var(--gold)"></i>
                                <span>${user.gems ? user.gems.toLocaleString() : 0} جوهرة</span>
                            </div>
                        </div>
                    </div>
                `;
                leaderboardList.appendChild(item);
            });
        };

        window.closeLeaderboard = () => document.getElementById('leaderboardModal').style.display = 'none';
    </script>
</body>
</html>
