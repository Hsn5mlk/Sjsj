<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مدير الكنز | Treasure Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #34495e;
            --accent: #3498db;
            --danger: #e74c3c;
            --success: #27ae60;
            --bg-light: #f8f9fa;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-light);
            margin: 0;
            display: flex;
            color: #333;
            overflow-x: hidden;
        }

        /* Side Menu */
        .sidebar {
            width: var(--sidebar-width);
            background: #2c3e50;
            height: 100vh;
            color: white;
            position: fixed;
            right: 0;
            top: 0;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 25px;
            text-align: center;
            background: #1a252f;
        }
        .sidebar-header h2 {
            margin: 0;
            color: var(--accent);
            font-size: 22px;
            letter-spacing: 1px;
        }

        .sidebar menu {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        .sidebar menu li {
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            border-right: 4px solid transparent;
        }

        .sidebar menu li:hover, .sidebar menu li.active {
            background: #3e5871;
            border-right-color: var(--accent);
            color: var(--accent);
        }

        /* Main Content */
        .main-content {
            margin-right: var(--sidebar-width);
            padding: 20px;
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 16px 24px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header-bar h1 { 
            margin: 0;             font-size: 22px; 
            color: var(--primary); 
        }

        /* Grid & Cards */
        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            position: relative;
            border: 1px solid #eee;
            text-align: right;
        }

        .card:hover { 
            transform: translateY(-4px); 
        }

        .card h4 { 
            margin-top: 0; 
            color: var(--primary); 
            font-size: 18px; 
            word-break: break-word;
        }
        
        .card p { 
            color: #666; 
            font-size: 14px; 
            line-height: 1.6; 
            margin: 8px 0;
            word-break: break-word;
        }

        .card-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;        }

        .delete-btn {
            background: #fff;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .delete-btn:hover { 
            background: var(--danger); 
            color: white; 
        }

        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: rgba(44, 62, 80, 0.98);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-box h3 { 
            margin-bottom: 25px; 
            color: var(--primary); 
        }

        .login-box input {
            width: 100%;            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: right;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .hidden { 
            display: none !important; 
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                transform: translateX(0);
            }
            .sidebar h2,
            .sidebar menu li span {
                display: none;
            }
            .sidebar menu li {
                justify-content: center;
                padding: 15px 10px;
            }
            .main-content {
                margin-right: 70px;
                padding: 15px;
            }
            .header-bar {
                padding: 14px 16px;
            }
            .grid-list {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .card-footer {                flex-direction: column;
                align-items: stretch;
            }
            .delete-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <i class="fas fa-lock-open fa-3x" style="color: var(--accent); margin-bottom: 15px;"></i>
            <h3>بوابة الإدارة الآمنة</h3>
            <input type="email" id="adminEmail" placeholder="البريد الإلكتروني">
            <input type="password" id="adminPass" placeholder="كلمة المرور">
            <button id="loginBtn">دخول النظام</button>
            <p id="loginError" style="color: var(--danger); font-size: 13px; margin-top: 15px;"></p>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>الكنز <i class="fas fa-gem"></i></h2>
        </div>
        <menu id="mainMenu">
            <li class="active" onclick="showSection('marketSection', this)"><i class="fas fa-shopping-basket"></i> <span>إدارة السوق</span></li>
            <li onclick="showSection('agentsSection', this)"><i class="fas fa-user-shield"></i> <span>إدارة الوكلاء</span></li>
            <li onclick="showSection('roomsSection', this)"><i class="fas fa-headset"></i> <span>إدارة الغرف</span></li>
            <li onclick="showSection('postsSection', this)"><i class="fas fa-stream"></i> <span>إدارة الجدار</span></li>
            <li onclick="showSection('membersSection', this)"><i class="fas fa-users"></i> <span>إدارة الأعضاء</span></li>
            <li onclick="handleLogout()" style="margin-top: 50px; color: #ff7675;"><i class="fas fa-power-off"></i> <span>تسجيل الخروج</span></li>
        </menu>
    </div>

    <div class="main-content">
        <div class="header-bar">
            <h1 id="sectionTitle">إدارة السوق</h1>
            <div id="adminInfo">
                <i class="fas fa-user-circle"></i> <span id="adminDisplayName">جاري التحقق...</span>
            </div>
        </div>

        <section id="marketSection" class="admin-section">
            <div class="grid-list" id="marketList"></div>
        </section>

        <section id="agentsSection" class="admin-section hidden">            <div class="grid-list" id="agentsList"></div>
        </section>

        <section id="roomsSection" class="admin-section hidden">
            <div class="grid-list" id="roomsList"></div>
        </section>

        <section id="postsSection" class="admin-section hidden">
            <div class="grid-list" id="postsList"></div>
        </section>

        <section id="membersSection" class="admin-section hidden">
            <div class="grid-list" id="membersList"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYKCCTcurNcJslrNKqdiJCoIIK-YZArB4",
            authDomain: "sbaq-fc46f.firebaseapp.com",
            projectId: "sbaq-fc46f",
            storageBucket: "sbaq-fc46f.firebasestorage.app",
            messagingSenderId: "1026865750415",
            appId: "1:1026865750415:web:0ee39a717bcafaa0d06bfa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ربط الأزرار
        document.getElementById('loginBtn').addEventListener('click', adminLogin);
        window.handleLogout = () => signOut(auth);
        
        async function adminLogin() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                document.getElementById('loginError').textContent = "فشل تسجيل الدخول: " + e.message;
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminDisplayName').textContent = user.email;
                loadAllData();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        });

        // دالة الحذف العامة
        window.deleteItem = async (col, id) => {
            if(confirm("⚠️ هل أنت متأكد؟ سيتم حذف هذا العنصر نهائياً من قاعدة البيانات.")) {
                try {
                    await deleteDoc(doc(db, col, id));
                } catch (err) {
                    alert("خطأ في الحذف: " + err.message);
                }
            }
        };

        // دالة إنشاء البطاقة
        const createCard = (title, content, col, id) => `
            <div class="card">
                <h4>${title}</h4>
                <p>${content}</p>
                <div class="card-footer">
                    <small>ID: ${id.substring(0,8)}...</small>
                    <button class="delete-btn" onclick="deleteItem('${col}', '${id}')">
                        <i class="fas fa-trash-alt"></i> حذف
                    </button>
                </div>
            </div>`;

        function loadAllData() {
            // السوق
            onSnapshot(collection(db, "products"), (snap) => {
                const list = document.getElementById('marketList');
                list.innerHTML = snap.empty ? "<p style='text-align:center;color:#777;'>لا يوجد منتجات حالياً</p>" : "";
                snap.forEach(d => {
                    const p = d.data();
                    list.innerHTML += createCard(p.name || 'بدون اسم', `السعر: ${p.price || 'غير محدد'}`, 'products', d.id);
                });
            });

            // الوكلاء
            onSnapshot(collection(db, "agents"), (snap) => {
                const list = document.getElementById('agentsList');
                list.innerHTML = snap.empty ? "<p style='text-align:center;color:#777;'>لا يوجد وكلاء</p>" : "";
                snap.forEach(d => {
                    const a = d.data();
                    list.innerHTML += createCard(a.name || 'وكلاء غير معروف', a.desc || 'لا يوجد وصف', 'agents', d.id);                });
            });

            // الغرف
            onSnapshot(collection(db, "rooms"), (snap) => {
                const list = document.getElementById('roomsList');
                list.innerHTML = snap.empty ? "<p style='text-align:center;color:#777;'>لا توجد غرف</p>" : "";
                snap.forEach(d => {
                    const r = d.data();
                    list.innerHTML += createCard(`غرفة: ${r.name || 'بدون اسم'}`, `المالك: ${r.ownerName || 'غير معروف'}`, 'rooms', d.id);
                });
            });

            // الجدار
            onSnapshot(collection(db, "posts"), (snap) => {
                const list = document.getElementById('postsList');
                list.innerHTML = snap.empty ? "<p style='text-align:center;color:#777;'>الجدار فارغ</p>" : "";
                snap.forEach(d => {
                    const p = d.data();
                    const text = p.text || p.content || 'محتوى فارغ';
                    const author = p.userName || 'مجهول';
                    list.innerHTML += createCard(`كاتب: ${author}`, text, 'posts', d.id);
                });
            });

            // الأعضاء (المستخدمين)
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('membersList');
                list.innerHTML = snap.empty ? "<p style='text-align:center;color:#777;'>لا يوجد أعضاء</p>" : "";
                snap.forEach(d => {
                    const u = d.data();
                    const displayName = u.name || u.displayName || u.email || 'عضو بدون اسم';
                    const email = u.email ? `البريد: ${u.email}` : 'لا يوجد بريد';
                    list.innerHTML += createCard(displayName, email, 'users', d.id);
                });
            });
        }

        // التبديل بين الأقسام
        window.showSection = (id, el) => {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('#mainMenu li').forEach(li => li.classList.remove('active'));
            
            document.getElementById(id).classList.remove('hidden');
            el.classList.add('active');
            document.getElementById('sectionTitle').textContent = el.querySelector('span').textContent;
        };

    </script>
</body></html>
